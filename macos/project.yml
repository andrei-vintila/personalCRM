# Generates PRM.xcodeproj:  brew install xcodegen && xcodegen
name: PRM
options:
  bundleIdPrefix: com.prm
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PRM:
    type: application
    platform: macOS
    sources:
      - path: PRM
    info:
      path: PRM/Info.plist
      properties:
        CFBundleDisplayName: PRM
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        # Plain-HTTP servers (e.g. http://localhost during development) are allowed.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: PRM/PRM.entitlements
      properties:
        # Not sandboxed: reading call history and WhatsApp needs Full Disk Access,
        # which sandboxed apps can't get. Distribute outside the App Store.
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prm.mac
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
